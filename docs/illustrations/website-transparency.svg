<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Opt-in transparent website backgrounds</title>
  <desc id="desc">The transparent part of a website reveals desktop colors when the setting is enabled. Its text, image and explicitly painted card remain opaque.</desc>
  <defs>
    <clipPath id="page"><rect x="150" y="74" width="420" height="125"/></clipPath>
    <style>
      text{font-family:system-ui,sans-serif;fill:#D5D6DB}.small{font-size:11px;fill:#787C99}
      .backing{animation:clear 7s ease-in-out infinite}.knob{animation:toggle 7s ease-in-out infinite}.enabled{animation:enabled 7s ease-in-out infinite}
      @keyframes clear{0%,18%,100%{opacity:1}40%,78%{opacity:0}}
      @keyframes toggle{0%,18%,100%{transform:translateX(0)}40%,78%{transform:translateX(18px)}}
      @keyframes enabled{0%,18%,100%{opacity:0}40%,78%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.motion{animation:none!important}.backing{opacity:0}.knob{transform:translateX(18px)}.enabled{opacity:1}}
    </style>
  </defs>
  <rect width="720" height="260" rx="16" fill="#0e1017"/>
  <text x="28" y="28" class="small" letter-spacing="2">OPT-IN WEBSITE TRANSPARENCY</text>
  <path d="M91 195Q300 45 475 155T650 90" stroke="#BB9AF7" stroke-width="35" fill="none" opacity=".4"/>
  <path d="M86 220Q304 104 485 198T650 130" stroke="#41A6B5" stroke-width="25" fill="none" opacity=".35"/>
  <rect x="150" y="36" width="420" height="38" rx="10" fill="#24283B"/>
  <rect x="150" y="62" width="420" height="12" fill="#24283B"/>
  <circle cx="168" cy="55" r="3" fill="#8698df"/><text x="183" y="59" font-size="11">Your site, with room for the desktop</text>
  <g clip-path="url(#page)">
    <rect x="150" y="74" width="420" height="125" fill="#0e1017" class="backing motion"/>
    <text x="174" y="107" font-size="18">Content stays solid.</text>
    <path d="M175 126H326 M175 141H302" stroke="#D5D6DB" stroke-width="3" stroke-linecap="round"/>
    <rect x="174" y="158" width="158" height="25" rx="5" fill="#24283B"/>
    <text x="186" y="175" font-size="10">Explicit CSS fills stay painted</text>
    <rect x="401" y="94" width="143" height="89" rx="7" fill="#24283B"/>
    <circle cx="506" cy="115" r="8" fill="#E0AF68"/>
    <path d="M408 172l34-43 23 26 22-19 50 36Z" fill="#8698df"/>
    <text x="416" y="196" font-size="9" style="fill:#787C99">IMAGES REMAIN OPAQUE</text>
  </g>
  <rect x="150" y="36" width="420" height="163" rx="10" fill="none" stroke="#444B6A"/>
  <rect x="216" y="219" width="42" height="20" rx="10" fill="#444B6A"/>
  <rect x="216" y="219" width="42" height="20" rx="10" fill="#41A6B5" class="enabled motion" opacity="0"/>
  <g transform="translate(226 229)"><circle r="7" fill="#D5D6DB" class="knob motion"/></g>
  <text x="272" y="233" font-size="11">Transparent website backgrounds</text>
</svg>
