<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Stack-style touchpad page transitions</title>
  <desc id="desc">A two-finger swipe slides the current page right, revealing the previous page underneath. The browser toolbar stays still.</desc>
  <defs>
    <clipPath id="pages"><path d="M150 74H570V186Q570 198 558 198H162Q150 198 150 186Z"/></clipPath>
    <style>
      text{font-family:system-ui,sans-serif;fill:#D5D6DB}.small{font-size:11px;fill:#787C99}
      .page{animation:reveal 6s ease-in-out infinite}.fingers{animation:gesture 6s ease-in-out infinite}
      @keyframes reveal{0%,15%,100%{transform:translateX(0)}55%,75%{transform:translateX(285px)}}
      @keyframes gesture{0%,15%,100%{transform:translateX(0)}55%,75%{transform:translateX(65px)}}
      @media(prefers-reduced-motion:reduce){.motion{animation:none!important}.page{transform:translateX(150px)}}
    </style>
  </defs>
  <rect width="720" height="260" rx="16" fill="#0e1017"/>
  <text x="28" y="28" class="small" letter-spacing="2">TOUCHPAD NAVIGATION</text>
  <rect x="150" y="36" width="420" height="162" rx="12" fill="#24283B" stroke="#444B6A"/>
  <path d="M150 74H570" stroke="#444B6A"/>
  <path d="M174 49l-6 6 6 6 M168 55h15" stroke="#8698df" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="200" y="46" width="280" height="18" rx="5" fill="#0e1017"/>
  <text x="214" y="59" font-size="10">The toolbar stays put</text>
  <g clip-path="url(#pages)">
    <rect x="150" y="74" width="420" height="124" fill="#24283B"/>
    <rect x="174" y="95" width="75" height="7" rx="3" fill="#41A6B5"/>
    <text x="174" y="123" font-size="17">Previous page</text>
    <path d="M174 143H338 M174 157H310" stroke="#444B6A" stroke-width="4" stroke-linecap="round"/>
    <g class="page motion">
      <rect x="145" y="74" width="425" height="124" fill="#0e1017" opacity=".35"/>
      <rect x="150" y="74" width="420" height="124" fill="#24283B"/>
      <path d="M151 74V198" stroke="#8698df" stroke-opacity=".45"/>
      <rect x="174" y="95" width="75" height="7" rx="3" fill="#8698df"/>
      <text x="174" y="123" font-size="17">Current page</text>
      <path d="M174 143H370 M174 157H330" stroke="#444B6A" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <rect x="284" y="211" width="152" height="31" rx="8" fill="none" stroke="#444B6A"/>
  <g class="fingers motion" stroke="#D5D6DB" stroke-width="4" stroke-linecap="round"><path d="M318 221V231 M329 221V231"/></g>
  <text x="459" y="231" class="small">TWO FINGERS · ONE FLUID STACK</text>
</svg>
