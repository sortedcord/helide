<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Three-finger tab scrubbing</title>
  <desc id="desc">Three fingers slide down a touchpad. A glow slides smoothly down the tab list while the current tab stays active. Lifting the fingers switches to the tab under the glow.</desc>
  <defs>
    <filter id="soft" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      text{font-family:system-ui,sans-serif;fill:#D5D6DB}.small{font-size:11px;fill:#787C99}.tab{font-size:12px}
      .glow{opacity:0;animation:glow 7s ease-in-out infinite}
      .fingers{animation:fingers 7s ease-in-out infinite}
      .from{animation:from 7s ease-in-out infinite}.to{opacity:0;animation:to 7s ease-in-out infinite}
      .hint-a{animation:hint-a 7s ease-in-out infinite}.hint-b{opacity:0;animation:hint-b 7s ease-in-out infinite}
      @keyframes glow{0%,10%{opacity:0;transform:translateY(0)}18%{opacity:1;transform:translateY(0)}55%,64%{opacity:1;transform:translateY(64px)}72%,100%{opacity:0;transform:translateY(64px)}}
      @keyframes fingers{0%,10%{opacity:.25;transform:translateY(0)}18%{opacity:1;transform:translateY(0)}55%,64%{opacity:1;transform:translateY(46px)}72%,100%{opacity:.25;transform:translateY(46px)}}
      @keyframes from{0%,66%{opacity:1}67%,96%{opacity:0}100%{opacity:1}}
      @keyframes to{0%,66%{opacity:0}67%,96%{opacity:1}100%{opacity:0}}
      @keyframes hint-a{0%,64%{opacity:1}66%,98%{opacity:0}100%{opacity:1}}
      @keyframes hint-b{0%,64%{opacity:0}67%,96%{opacity:1}100%{opacity:0}}
      @media(prefers-reduced-motion:reduce){.motion{animation:none!important}.glow{opacity:1;transform:translateY(64px)}.fingers{opacity:1;transform:translateY(46px)}.from{opacity:1}.to{opacity:0}.hint-a{opacity:1}.hint-b{opacity:0}}
    </style>
  </defs>
  <rect width="720" height="260" rx="16" fill="#0e1017"/>
  <text x="28" y="28" class="small" letter-spacing="2">THREE-FINGER TAB SCRUBBING</text>

  <!-- the browser: vertical tab strip and page -->
  <rect x="64" y="48" width="330" height="170" rx="12" fill="#24283B" stroke="#444B6A"/>
  <path d="M184 48V218" stroke="#444B6A"/>
  <rect x="200" y="66" width="170" height="8" rx="4" fill="#444B6A"/>
  <rect x="200" y="86" width="120" height="6" rx="3" fill="#444B6A" opacity=".6"/>
  <rect x="200" y="102" width="146" height="6" rx="3" fill="#444B6A" opacity=".6"/>

  <!-- tab rows, 32 px apart; the current tab is the second -->
  <rect class="from motion" x="72" y="90" width="104" height="26" rx="8" fill="#444B6A"/>
  <rect class="to motion" x="72" y="154" width="104" height="26" rx="8" fill="#444B6A"/>
  <g class="tab">
    <text x="84" y="73">Inbox</text><text x="84" y="105">Docs</text><text x="84" y="137">Mail</text>
    <text x="84" y="169">Maps</text><text x="84" y="201">Music</text>
  </g>

  <!-- the glow, sliding from the current tab two rows down -->
  <g class="glow motion">
    <rect x="72" y="90" width="104" height="26" rx="8" fill="#8698df" opacity=".75" filter="url(#soft)"/>
    <rect x="72" y="90" width="104" height="26" rx="8" fill="#8698df" fill-opacity=".2" stroke="#8698df" stroke-width="1.5"/>
  </g>

  <!-- touchpad with three fingers -->
  <rect x="470" y="62" width="190" height="130" rx="14" fill="#24283B" stroke="#444B6A"/>
  <g class="fingers motion" fill="#BB9AF7">
    <circle cx="540" cy="98" r="8"/><circle cx="565" cy="98" r="8"/><circle cx="590" cy="98" r="8"/>
  </g>
  <path d="M565 160v14m0 0l-5-5m5 5l5-5" stroke="#787C99" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>

  <text x="565" y="224" text-anchor="middle" class="small hint-a motion">SLIDE: THE GLOW FOLLOWS YOUR FINGERS</text>
  <text x="565" y="224" text-anchor="middle" class="small hint-b motion" style="fill:#41A6B5">LIFT: SWITCH TO THE GLOWING TAB</text>
</svg>
