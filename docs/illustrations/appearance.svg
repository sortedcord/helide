<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Live window transparency and blur</title>
  <desc id="desc">The browser's background tint fades as an opacity slider moves. Soft desktop colors show through while text and controls remain solid.</desc>
  <defs>
    <clipPath id="window"><rect x="150" y="36" width="420" height="160" rx="12"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="15"/></filter>
    <style>
      text{font-family:system-ui,sans-serif;fill:#D5D6DB} .small{font-size:11px;fill:#787C99}
      .tint{animation:tint 6s ease-in-out infinite}.thumb{animation:slide 6s ease-in-out infinite}
      @keyframes tint{0%,15%,100%{opacity:1}45%,70%{opacity:.4}}
      @keyframes slide{0%,15%,100%{transform:translateX(180px)}45%,70%{transform:translateX(60px)}}
      @media(prefers-reduced-motion:reduce){.motion{animation:none!important}}
    </style>
  </defs>
  <rect width="720" height="260" rx="16" fill="#0e1017"/>
  <text x="28" y="28" class="small" letter-spacing="2">LIVE APPEARANCE</text>
  <path d="M90 172 Q260 10 390 130 T660 60" fill="none" stroke="#BB9AF7" stroke-width="20" opacity=".3"/>
  <path d="M65 195 Q280 90 440 173 T670 130" fill="none" stroke="#41A6B5" stroke-width="28" opacity=".25"/>
  <g clip-path="url(#window)">
    <g filter="url(#soft)" opacity=".75"><ellipse cx="260" cy="95" rx="100" ry="45" fill="#BB9AF7"/><ellipse cx="470" cy="150" rx="130" ry="45" fill="#41A6B5"/></g>
    <rect x="150" y="36" width="420" height="160" fill="#24283B" opacity=".65" class="tint motion"/>
    <path d="M150 75H570" stroke="#444B6A"/>
    <circle cx="168" cy="55" r="3" fill="#F7768E"/><circle cx="180" cy="55" r="3" fill="#E0AF68"/><circle cx="192" cy="55" r="3" fill="#41A6B5"/>
    <rect x="215" y="45" width="128" height="22" rx="6" fill="#0e1017" fill-opacity=".55"/>
    <text x="228" y="60" font-size="11">Helide</text>
    <path d="M173 93H310" stroke="#D5D6DB" stroke-width="5" stroke-linecap="round"/>
    <path d="M173 112H395 M173 127H360" stroke="#787C99" stroke-width="3" stroke-linecap="round"/>
    <rect x="173" y="147" width="83" height="25" rx="6" fill="#8698df"/>
    <text x="189" y="164" font-size="11" fill="#0e1017" style="fill:#0e1017">Stay crisp</text>
  </g>
  <rect x="150" y="36" width="420" height="160" rx="12" fill="none" stroke="#444B6A"/>
  <text x="150" y="228" class="small">OPACITY</text>
  <path d="M235 224H475" stroke="#444B6A" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(235 224)"><circle r="7" fill="#8698df" class="thumb motion"/></g>
  <text x="500" y="228" class="small">LIVE · NO RELAUNCH</text>
</svg>
